name: aupmoosic
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^5.0.2
  fl_chart: ^0.69.0
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  provider: ^6.1.1
  cupertino_icons: ^1.0.8

  table_calendar: ^3.0.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  daptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#F0F4F8"
  image: "assets/app_icon.png"
  android_12:
    color: "#F0F4F8"
    image: "assets/app_icon.png"